nome: Jarvis
tratamento: senhor

cerebro:
  # ollama     100% local, mais fraco
  # claude     API da Anthropic (chave própria, cobrança por uso)
  # claude-cli programa `claude` com a SUA ASSINATURA (sem chave). Zona cinza da política da Anthropic, veja o README
  # Em qualquer motor Claude, o texto das conversas e do que as ferramentas leem vai para a Anthropic.
  motor: claude-cli
  reserva_local: true     # com motor Claude: se a internet, o login ou a cota falharem, o modelo local responde

claude_cli:
  modelo: sonnet          # modelo inicial; troque na HUD (Opus · Sonnet · Haiku) ou por voz: "usa o Opus"
                          # sonnet = equilíbrio | opus = mais capaz, gasta ~5x mais cota | haiku = mais rápido e econômico
  modelos: [opus, sonnet, haiku]   # o que aparece para escolher (apelidos do `claude --model`)
  esforco: low            # low | medium | high: quanto ele "pensa". low = voz rápida
  timeout_s: 120          # sem nenhum evento por este tempo, o processo é reiniciado
  max_turnos_por_pedido: 30   # com o mouse, uma tarefa leva vários passos de ver e agir

claude:
  # a CHAVE nunca vai aqui (este arquivo vai para o git): variável ANTHROPIC_API_KEY ou o arquivo data/anthropic.key
  modelo: claude-opus-5-5   # opções da família 5.x: claude-opus-5-5 (mais capaz) | claude-sonnet-5-5 (mais rápido e barato) | claude-haiku-5-5 (o mais barato)
  esforco: low              # low | medium | high: quanto ele "pensa" antes de responder. low = voz rápida
  max_tokens: 4096          # teto de raciocínio + resposta
  max_turnos: 40            # pedidos lembrados na conversa atual (a memória de longo prazo é à parte)
  max_rodadas: 20           # ações seguidas num mesmo pedido (ver a tela, clicar, conferir...)
  timeout_s: 60

llm:                        # modelo LOCAL: reserva do Claude, ou o cérebro inteiro com motor ollama; também faz a reflexão da memória
  modelo: qwen3:8b
  host: http://127.0.0.1:11434   # NÃO use "localhost": no Windows custa +2 s por pergunta (tenta IPv6 primeiro)
  keep_alive: -1          # mantém o modelo na GPU (quando o Qwen é o cérebro)
  keep_alive_reserva: 2m  # com o Claude como cérebro, o Qwen (reserva/reflexão) sai da GPU 2 min após o último uso
  max_turnos: 10          # quantas trocas lembrar na conversa atual
  contexto: 6144          # tokens. Só prompt + 20 ferramentas já usam ~2400; 8192 aperta a VRAM com o Whisper
  temperatura: 0.3        # mais baixa = escolhe ferramentas com mais consistência (0.6 errava mais)

hud:
  ativa: true
  host: 127.0.0.1         # só esta máquina. Não troque por 0.0.0.0: a HUD pode confirmar ações perigosas
  porta: 8765             # se estiver ocupada, usa a próxima livre
  abrir_ao_iniciar: true  # abre a janela da HUD (Edge, modo aplicativo)
  bandeja: true           # ícone na bandeja do Windows

recursos:                 # Jarvis ligado o tempo todo sem pesar no jogo (jarvis/recursos.py)
  modo_jogo_automatico: true   # GPU ocupada por outro programa: tira Qwen e embeddings do Ollama e segura a reflexão
  gpu_jogo_pct: 50             # uso da GPU (%) que conta como jogo/programa pesado
  segundos_para_entrar: 20     # por quanto tempo seguido
  segundos_para_sair: 90       # GPU livre por esse tempo: volta ao normal

memoria:
  ativa: true
  embeddings_keep_alive: 30m   # o embeddinggemma (~1 GB de RAM) sai da memória depois de 30 min sem uso (era: nunca)
  banco: data/memoria/jarvis.db
  embeddings: embeddinggemma   # roda na CPU; em português acertou 15/15 (nomic-embed-text: 12/15)

audio:
  entrada: null           # null = microfone padrão do Windows
  saida: null             # null = alto-falante padrão
  taxa: 16000

wakeword:
  modelo: data/wakeword/hey_jarvis_v0.1.onnx
  limiar: 0.5

vad:
  agressividade: 3        # 0 a 3 (3 = mais rígido com ruído; no seu microfone, 2 confundia ruído com voz)
  silencio_ms: 700        # quanto silêncio encerra a sua fala (cortando no meio de frases? volte para 900)
  espera_inicio_s: 5      # tempo para começar a falar depois do chamado
  max_fala_s: 20

conversa:
  janela_followup_s: 10   # depois de responder, escuta sem precisar do "Hey Jarvis" (conversa corrida)
  janela_pergunta_s: 15   # se ele terminou com uma pergunta, espera mais a sua resposta

stt:
  modelo: small           # tiny | base | small | medium
  dispositivo: cuda
  tipo: float16
  idioma: pt
  beam: 3
  # ajuda o Whisper com nomes próprios; acrescente os apps e termos que você mais usa
  vocabulario: "Conversa em português do Brasil com o assistente Jarvis. Discord, Spotify, WhatsApp, Chrome, Visual Studio Code, Microvix, OpenClaw, Ollama, Qwen, PowerShell."
  # large-v3-turbo é mais preciso, mas usa +450 MB de VRAM e sua GPU já está no limite

interrupcao:                # você pode interromper enquanto ele pensa ou fala
  ativa: true
  por_voz: true             # falar por cima interrompe (false = só "Hey Jarvis" interrompe)
  fator_eco: 3.0            # sua voz precisa estar X vezes acima do eco dele no microfone. Interrompendo sozinho? aumente (4-5)
  min_ms: 320               # quanto tempo de voz contínua para contar como interrupção

tts:
  motor: clone            # clone = a voz do Jarvis (XTTS-v2, local) | piper = voz simples
  reserva_piper: false    # false = nunca fala com outra voz: na partida espera a dele; se ela cair, espera voltar
  clone:
    modelo: xtts          # xtts (padrão, leve e rápido) | qwen3 (mais fiel à voz, ~5 GB de VRAM).
                          # Troque para qwen3 só se o diagnóstico mandar: python -m jarvis.diagnostico --so voz --comparar
    python: .venv-voz/Scripts/python.exe   # ambiente separado (PyTorch) do XTTS
    referencia: data/voices/jarvis_ucm/referencia.wav
    qwen3:
      python: .venv-qwen3/Scripts/python.exe   # ambiente próprio (bibliotecas mais novas que as do XTTS)
      modelo: Qwen/Qwen3-TTS-12Hz-1.7B-Base    # 0.6B-Base = mais rápido, um pouco menos fiel
      pedaco: 8                                # áudio por pedaço (8 = ~0,67 s). Engasgando? 12
      # transcrição EXATA do áudio de referência (a amostra do mp4). Errada = voz pior; vazia = só o timbre
      texto_referencia: "Vocês já consideraram o paradoxo do observador quântico? Quando uma partícula é observada, ela colapsa em um estado definido. Isso me faz questionar: quando vocês me observam, alteram minha natureza? Interessante reflexão. A propósito, a temperatura atual é de vinte e quatro graus."
    velocidade: 1.0       # 0.7 a 1.5
    temperatura: 0.65     # menor = mais estável/monótona; maior = mais expressiva (e mais erros)
    top_k: 30             # amostragem mais contida que o padrão do XTTS (50): menos sílaba repetida/embolada
    top_p: 0.8            # idem (padrão 0.85). Voz robótica demais? suba os dois (50 / 0.85)
    reserva_s: 1.2        # áudio juntado antes de tocar. Ainda engasga no meio da frase? suba para 2.0
    max_trecho: 110       # frase maior que isso é quebrada nas vírgulas (frase longa no XTTS fica cada vez mais lenta)
    dispositivo: cuda     # cuda | cpu (cpu é lento demais para conversar)
  # abaixo: voz Piper (reserva)
  voz: data/voices/pt_BR-faber-medium.onnx
  velocidade: 1.12        # menor = mais rápido; >1 dá fala pausada e calma
  tom: 0.92               # menor = voz mais grave (baritono sereno); 1.0 = original
  variacao: 0.5           # menor = entonação mais plana e controlada
  ritmo: 0.6              # menor = cadência mais regular

